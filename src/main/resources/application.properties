spring.application.name=jaxrs-server

server.port=8082

spring.jersey.application-path=/api

spring.h2.console.enabled=true
spring.datasource.url=jdbc:h2:mem:directors;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none

spring.h2.console.path=/h2-console

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


TMDB_API_TOKEN environment variable.
tmdb.base-url=https://api.themoviedb.org/3
tmdb.api-token=${TMDB_API_TOKEN:}
tmdb.import-on-startup=true
#Nolan, Tarantino, Spielberg, Villeneuve, Hitchcock, Kubrick
tmdb.startup-director-ids=525,138,488,137427,2636,240